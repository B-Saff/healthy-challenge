<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Healthy Challenge</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div class="page">
  <header class="top">
    <h1>🏆 Healthy Challenge</h1>
    <span class="today-date" id="today-date"></span>
  </header>

  <nav class="links">
    <a href="history.html">📜 View History</a>
  </nav>

  <div id="error-banner" class="error-banner" style="display:none;"></div>
  <div id="loading" class="loading">Loading…</div>

  <main id="app" style="display:none;">
    <section class="card" id="week-card">
      <h2>This Week</h2>
      <div id="week-content"></div>
    </section>

    <section class="card">
      <h2>Today</h2>
      <div id="today-ben"></div>
    </section>
    <section class="card">
      <div id="today-chelsea"></div>
    </section>

    <section class="card">
      <h2>Lifetime Progress</h2>
      <div id="lifetime-content"></div>
    </section>
  </main>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
